<body>


<div class="container">

HARBAR DRIVER CHECK-IN

Place the PDF417 barcode on the back of the license inside the rectangle.

STOP CAMERA

<input

<script>


/*****************************************************
 GOOGLE APPS SCRIPT WEB APP
 YA CONFIGURADO
*****************************************************/

const WEB_APP_URL =
'https://script.google.com/macros/s/AKfycbwAY2uZp9y0eAzxW57NlwQw-tL0F6Y_5CsdmRqkT1KL4HWvO_kL-G6TaFOn4MMvNZJU/exec';



/*****************************************************
 VARIABLES
*****************************************************/

let cameraStream = null;

let scanTimer = null;

let decoderBusy = false;

let scanAttempts = 0;

let submitting = false;



/*****************************************************
 CONNECT FORM
*****************************************************/

document
  .getElementById(
    'checkinForm'
  )
  .action =
  WEB_APP_URL;



/*****************************************************
 UNIQUE SUBMISSION ID
*****************************************************/

function generateSubmissionId() {


  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (

    Date.now() +

    '-' +

    Math.random()
      .toString(36)
      .substring(2)

  );

}



document
  .getElementById(
    'submissionId'
  )
  .value =
  generateSubmissionId();



/*****************************************************
 STATUS
*****************************************************/

function showStatus(
  message,
  type = ''
) {


  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    message;


  status.className =
    type;

}



/*****************************************************
 START CAMERA
*****************************************************/

async function startScanner() {


  try {


    stopScanner();


    scanAttempts =
      0;


    showStatus(

      'Opening camera...',

      'scanning'

    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Camera is not supported by this browser.'
      );

    }


    const constraints = {

      audio: false,

      video: {

        facingMode: {
          ideal: 'environment'
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      }

    };


    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia(
          constraints
        );


    const video =
      document.getElementById(
        'video'
      );


    video.srcObject =
      cameraStream;


    await video.play();


    showStatus(

      'Scanning PDF417... Keep the barcode centered and in focus.',

      'scanning'

    );


    scanTimer =
      setInterval(

        scanCameraFrame,

        500

      );


  }

  catch (error) {


    console.error(
      error
    );


    showStatus(

      'Camera error: ' +
      (
        error.message ||
        error
      ),

      'error'

    );

  }

}



/*****************************************************
 STOP CAMERA
*****************************************************/

function stopScanner() {


  if (
    scanTimer
  ) {

    clearInterval(
      scanTimer
    );


    scanTimer =
      null;

  }


  if (
    cameraStream
  ) {


    cameraStream
      .getTracks()
      .forEach(

        function(track) {

          track.stop();

        }

      );


    cameraStream =
      null;

  }


  const video =
    document.getElementById(
      'video'
    );


  if (
    video
  ) {

    video.srcObject =
      null;

  }


  decoderBusy =
    false;

}



/*****************************************************
 SCAN CAMERA FRAME
*****************************************************/

async function scanCameraFrame() {


  if (
    decoderBusy
  ) {

    return;

  }


  const video =
    document.getElementById(
      'video'
    );


  if (
    !video ||
    video.readyState < 2 ||
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return;

  }


  decoderBusy =
    true;


  scanAttempts++;


  try {


    const canvas =
      document.getElementById(
        'scanCanvas'
      );


    const ctx =
      canvas.getContext(

        '2d',

        {
          willReadFrequently: true
        }

      );


    const originalWidth =
      video.videoWidth;


    const originalHeight =
      video.videoHeight;



    const cropX =
      Math.round(
        originalWidth * 0.05
      );


    const cropY =
      Math.round(
        originalHeight * 0.25
      );


    const cropWidth =
      Math.round(
        originalWidth * 0.90
      );


    const cropHeight =
      Math.round(
        originalHeight * 0.50
      );


    const maximumWidth =
      1800;


    const scale =
      Math.min(

        1,

        maximumWidth /
        cropWidth

      );


    canvas.width =
      Math.round(

        cropWidth *
        scale

      );


    canvas.height =
      Math.round(

        cropHeight *
        scale

      );


    ctx.drawImage(

      video,

      cropX,
      cropY,

      cropWidth,
      cropHeight,

      0,
      0,

      canvas.width,
      canvas.height

    );


    const imageData =
      ctx.getImageData(

        0,
        0,

        canvas.width,
        canvas.height

      );


    const results =
      await ZXingWASM
        .readBarcodes(

          imageData,

          {

            formats: [
              'PDF417'
            ],

            tryHarder: true,

            tryRotate: true,

            tryInvert: true,

            tryDownscale: true,

            tryDenoise: true,

            maxNumberOfSymbols: 1

          }

        );


    const result =
      results.find(

        function(item) {

          return (

            item &&

            item.isValid &&

            item.text

          );

        }

      );


    if (
      result
    ) {


      const raw =
        result.text;


      console.log(

        'RAW LICENSE DATA:',

        raw

      );


      stopScanner();


      showStatus(

        '✓ License barcode detected. Reading information...',

        'success'

      );


      parseLicense(
        raw
      );


      return;

    }


    showStatus(

      'Scanning PDF417... ' +

      originalWidth +

      ' × ' +

      originalHeight +

      ' | Attempt ' +

      scanAttempts,

      'scanning'

    );


  }

  catch (error) {


    console.error(

      'Scanner error:',

      error

    );


    showStatus(

      'Scanner active, but the barcode has not been decoded yet.',

      'error'

    );

  }

  finally {


    decoderBusy =
      false;

  }

}



/*****************************************************
 NORMALIZE AAMVA TEXT
*****************************************************/

function normalizeAamvaText(
  raw
) {


  return String(
    raw || ''
  )


  .replace(
    /<LF>/gi,
    '\n'
  )

  .replace(
    /<CR>/gi,
    '\n'
  )

  .replace(
    /<GS>/gi,
    '\n'
  )

  .replace(
    /<RS>/gi,
    '\n'
  )

  .replace(
    /<US>/gi,
    '\n'
  )

  .replace(
    /\\n/g,
    '\n'
  )

  .replace(
    /\\r/g,
    '\n'
  )

  .replace(
    /\r\n/g,
    '\n'
  )

  .replace(
    /\r/g,
    '\n'
  )

  .replace(
    /[\x1c\x1d\x1e\x1f]/g,
    '\n'
  )

  .replace(
    /\u0000/g,
    ''
  );

}



/*****************************************************
 GET AAMVA FIELD

 IMPORTANT:
 We now only identify AAMVA codes at the
 beginning of lines.

 This prevents the driver's name from being
 incorrectly cut when a sequence of letters
 looks like another AAMVA code.
*****************************************************/

function getAamvaField(
  raw,
  code
) {


  const text =
    normalizeAamvaText(
      raw
    );


  const lines =
    text
      .split(
        '\n'
      )
      .map(
        function(line) {

          return line.trim();

        }
      )
      .filter(
        function(line) {

          return (
            line.length > 0
          );

        }
      );



  for (
    let i = 0;
    i < lines.length;
    i++
  ) {


    const line =
      lines[i];



    /*
      Example:

      DACRENZO ANDRES
    */

    if (
      line.startsWith(
        code
      )
    ) {

      return cleanField(

        line.substring(
          code.length
        )

      );

    }



    /*
      Some licenses can begin with:

      DLDAC...
      IDDAC...
    */

    if (
      line.startsWith(
        'DL' + code
      )
    ) {

      return cleanField(

        line.substring(
          code.length + 2
        )

      );

    }


    if (
      line.startsWith(
        'ID' + code
      )
    ) {

      return cleanField(

        line.substring(
          code.length + 2
        )

      );

    }

  }



  /*
    Safe fallback:
    the field must begin at the start of
    the data or immediately after a line break.
  */


  const expression =
    new RegExp(

      '(?:^|\\n)(?:DL|ID)?' +

      code +

      '([^\\n]*)',

      'm'

    );


  const match =
    text.match(
      expression
    );


  if (
    match
  ) {

    return cleanField(
      match[1]
    );

  }


  return '';

}



/*****************************************************
 CLEAN FIELD
*****************************************************/

function cleanField(
  value
) {


  return String(
    value || ''
  )


  .replace(
    /<LF>/gi,
    ''
  )

  .replace(
    /<CR>/gi,
    ''
  )

  .replace(
    /<GS>/gi,
    ''
  )

  .replace(
    /<RS>/gi,
    ''
  )

  .replace(
    /<US>/gi,
    ''
  )

  .replace(
    /<[^>]+>/g,
    ''
  )

  .replace(
    /[\r\n\t]/g,
    ''
  )

  .trim();

}



/*****************************************************
 CLEAN NAME
*****************************************************/

function cleanName(
  value
) {


  return cleanField(
    value
  )


  .replace(
    /[^A-Za-zÀ-ÿ' -]/g,
    ''
  )


  .replace(
    /\s+/g,
    ' '
  )


  .trim();

}



/*****************************************************
 CLEAN STATE
*****************************************************/

function cleanState(
  value
) {


  return cleanField(
    value
  )


  .replace(
    /[^A-Za-z]/g,
    ''
  )


  .substring(
    0,
    2
  )


  .toUpperCase();

}



/*****************************************************
 CLEAN LICENSE NUMBER
*****************************************************/

function cleanLicenseNumber(
  value
) {


  return cleanField(
    value
  )


  .replace(
    /[^A-Za-z0-9]/g,
    ''
  )


  .trim();

}



/*****************************************************
 FORMAT DATE
*****************************************************/

function formatDate(
  value
) {


  if (
    !value
  ) {

    return '';

  }


  const numbers =
    cleanField(
      value
    )
    .replace(
      /\D/g,
      ''
    );


  if (
    numbers.length !== 8
  ) {

    return '';

  }


  let yyyy;

  let mm;

  let dd;


  const firstFour =
    Number(

      numbers.substring(
        0,
        4
      )

    );


  if (
    firstFour >= 1900 &&
    firstFour <= 2200
  ) {


    yyyy =
      numbers.substring(
        0,
        4
      );


    mm =
      numbers.substring(
        4,
        6
      );


    dd =
      numbers.substring(
        6,
        8
      );

  }

  else {


    mm =
      numbers.substring(
        0,
        2
      );


    dd =
      numbers.substring(
        2,
        4
      );


    yyyy =
      numbers.substring(
        4,
        8
      );

  }


  const monthNumber =
    Number(
      mm
    );


  const dayNumber =
    Number(
      dd
    );


  if (
    monthNumber < 1 ||
    monthNumber > 12 ||
    dayNumber < 1 ||
    dayNumber > 31
  ) {

    return '';

  }


  return (

    yyyy +

    '-' +

    mm +

    '-' +

    dd

  );

}



/*****************************************************
 PARSE LICENSE
*****************************************************/

function parseLicense(
  raw
) {


  /*
    DAC = First Name / Given Name

    DAD = Middle Name

    DCT = Given Names (older AAMVA versions)

    DCS = Family Name / Last Name

    DAB = Last Name (older versions)

    DAQ = License Number

    DAJ = State

    DBA = Expiration
  */



  const firstNameRaw =

    getAamvaField(
      raw,
      'DAC'
    )

    ||

    getAamvaField(
      raw,
      'DCT'
    );



  const middleNameRaw =

    getAamvaField(
      raw,
      'DAD'
    );



  const lastNameRaw =

    getAamvaField(
      raw,
      'DCS'
    )

    ||

    getAamvaField(
      raw,
      'DAB'
    );



  const licenseRaw =

    getAamvaField(
      raw,
      'DAQ'
    );



  const stateRaw =

    getAamvaField(
      raw,
      'DAJ'
    );



  const expirationRaw =

    getAamvaField(
      raw,
      'DBA'
    );



  let firstName =
    cleanName(
      firstNameRaw
    );



  const middleName =
    cleanName(
      middleNameRaw
    );



  /*
    Add middle name only if DAC does not
    already contain it.
  */

  if (
    middleName &&
    !firstName
      .toUpperCase()
      .includes(
        middleName.toUpperCase()
      )
  ) {


    firstName =

      (
        firstName +
        ' ' +
        middleName
      )
      .trim();

  }



  const lastName =
    cleanName(
      lastNameRaw
    );



  const licenseNumber =
    cleanLicenseNumber(
      licenseRaw
    );



  const state =
    cleanState(
      stateRaw
    );



  const expiration =
    formatDate(
      expirationRaw
    );



  document
    .getElementById(
      'firstName'
    )
    .value =
    firstName;



  document
    .getElementById(
      'lastName'
    )
    .value =
    lastName;



  document
    .getElementById(
      'licenseState'
    )
    .value =
    state;



  document
    .getElementById(
      'licenseLast4'
    )
    .value =

    licenseNumber

    ?

    licenseNumber.slice(
      -4
    )

    :

    '';



  document
    .getElementById(
      'expiration'
    )
    .value =
    expiration;



  if (
    firstName ||
    lastName ||
    licenseNumber
  ) {


    showStatus(

      '✓ License scanned successfully. Verify the information.',

      'success'

    );

  }

  else {


    showStatus(

      'Barcode detected, but driver information could not be identified.',

      'error'

    );

  }

}



/*****************************************************
 PREVENT MULTIPLE SUBMISSIONS
*****************************************************/

const checkinForm =
  document.getElementById(
    'checkinForm'
  );


const saveButton =
  document.getElementById(
    'saveButton'
  );


const submitFrame =
  document.getElementById(
    'submitFrame'
  );



checkinForm.addEventListener(

  'submit',

  function(event) {


    if (
      submitting
    ) {


      event.preventDefault();


      return false;

    }



    submitting =
      true;



    saveButton.disabled =
      true;



    saveButton.textContent =
      'SENDING CHECK-IN...';



    saveButton.style.opacity =
      '0.6';



    saveButton.style.cursor =
      'not-allowed';



    stopScanner();



    showStatus(

      'Sending check-in... Please wait.',

      'scanning'

    );

  }

);



/*****************************************************
 AFTER FORM SUBMISSION
*****************************************************/

submitFrame.addEventListener(

  'load',

  function() {


    if (
      !submitting
    ) {

      return;

    }



    checkinForm.style.display =
      'none';



    document
      .getElementById(
        'scanButton'
      )
      .style.display =
      'none';



    document
      .getElementById(
        'stopButton'
      )
      .style.display =
      'none';



    document
      .querySelector(
        '.scan-frame'
      )
      .style.display =
      'none';



    document
      .querySelector(
        '.small'
      )
      .style.display =
      'none';



    document
      .getElementById(
        'status'
      )
      .style.display =
      'none';



    document
      .getElementById(
        'successScreen'
      )
      .style.display =
      'block';

  }

);


</script>
