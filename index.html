<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Harbar Driver Check-In</title>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/iife/reader/index.js"></script>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 650px;
  margin: auto;
  padding: 20px;
  background: #f5f7fa;
  color: #1f2937;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  color: #1f4e78;
}

video {
  width: 100%;
  max-height: 350px;
  background: black;
  border-radius: 10px;
  margin-top: 10px;
}

.scan-frame {
  position: relative;
}

.scan-guide {
  position: absolute;
  left: 8%;
  right: 8%;
  top: 35%;
  height: 30%;
  border: 3px solid rgba(255,255,255,.85);
  border-radius: 8px;
  pointer-events: none;
  box-sizing: border-box;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 14px;
}

input,
select {
  width: 100%;
  padding: 11px;
  margin-top: 5px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 6px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}

.scan {
  background: #1f4e78;
  color: white;
}

.save {
  background: #15803d;
  color: white;
}

.stop {
  background: #6b7280;
  color: white;
}

#status {
  margin-top: 15px;
  padding: 12px;
  background: #eee;
  border-radius: 6px;
}

.success {
  background: #dcfce7 !important;
  color: #166534;
}

.error {
  background: #fee2e2 !important;
  color: #991b1b;
}

.scanning {
  background: #dbeafe !important;
  color: #1e3a8a;
}

.small {
  font-size: 12px;
  color: #6b7280;
  margin-top: 5px;
}

</style>

</head>

<body>

<div class="container">

<h1>
HARBAR DRIVER CHECK-IN
</h1>


<button
  type="button"
  class="scan"
  onclick="startScanner()"
>
📷 SCAN DRIVER LICENSE
</button>


<div class="scan-frame">

  <video
    id="video"
    playsinline
    autoplay
    muted>
  </video>

  <div class="scan-guide"></div>

</div>


<canvas
  id="scanCanvas"
  style="display:none;">
</canvas>


<div class="small">
Place the PDF417 barcode on the back of the license inside the rectangle.
</div>


<button
  type="button"
  class="stop"
  onclick="stopScanner()"
>
STOP CAMERA
</button>


<form
  id="checkinForm"
  method="POST"
  target="submitFrame"
>


<label>
Station Key
</label>

<input
  type="password"
  id="stationKey"
  name="stationKey"
  required
>


<div class="row">

<div>

<label>
First Name
</label>

<input
  id="firstName"
  name="firstName"
  required
>

</div>


<div>

<label>
Last Name
</label>

<input
  id="lastName"
  name="lastName"
  required
>

</div>

</div>


<div class="row">

<div>

<label>
License State
</label>

<input
  id="licenseState"
  name="licenseState"
  maxlength="2"
>

</div>


<div>

<label>
License Last 4
</label>

<input
  id="licenseLast4"
  name="licenseLast4"
  maxlength="4"
>

</div>

</div>


<label>
License Expiration
</label>

<input
  type="date"
  id="expiration"
  name="expiration"
>


<label>
Carrier / Company
</label>

<input
  id="carrier"
  name="carrier"
>


<div class="row">

<div>

<label>
Reference Number
</label>

<input
  id="referenceNumber"
  name="referenceNumber"
  inputmode="numeric"
  required
>

</div>


<div>

<label>
Suffix
</label>

<select
  id="referenceSuffix"
  name="referenceSuffix"
  required
>

<option value="">
Select
</option>

<option value="T">
T
</option>

<option value="P">
P
</option>

</select>

</div>

</div>


<div class="row">

<div>

<label>
Truck Number
</label>

<input
  id="truckNumber"
  name="truckNumber"
>

</div>


<div>

<label>
Trailer Number
</label>

<input
  id="trailerNumber"
  name="trailerNumber"
>

</div>

</div>


<label>
Notes
</label>

<input
  id="notes"
  name="notes"
>


<button
  class="save"
  type="submit"
>
SAVE CHECK-IN
</button>


</form>


<div id="status">
Ready.
</div>


<iframe
  name="submitFrame"
  id="submitFrame"
  style="display:none;">
</iframe>

</div>


<script>


/***************************************************
 CAMBIA SOLAMENTE ESTA URL
****************************************************/

const WEB_APP_URL =
'https://script.google.com/macros/s/AKfycbyZmwlwQ709iIn1zgY5mLitRAopUMCvSfO6hUkhniHzYF6KvT-P64GGAZlIfYs0U74/exec';



let cameraStream = null;
let scanTimer = null;
let decoderBusy = false;
let scanAttempts = 0;



document
  .getElementById('checkinForm')
  .action =
  WEB_APP_URL;



const savedKey =
  localStorage.getItem(
    'harbarStationKey'
  );


if (savedKey) {

  document
    .getElementById('stationKey')
    .value =
    savedKey;

}



function showStatus(
  message,
  type = ''
) {

  const status =
    document.getElementById(
      'status'
    );

  status.textContent =
    message;

  status.className =
    type;

}



async function startScanner() {

  try {

    stopScanner();

    scanAttempts = 0;

    showStatus(
      'Opening camera...',
      'scanning'
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Camera is not supported by this browser.'
      );

    }


    const constraints = {

      audio: false,

      video: {

        facingMode: {
          ideal: 'environment'
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      }

    };


    cameraStream =
      await navigator.mediaDevices
        .getUserMedia(constraints);


    const video =
      document.getElementById(
        'video'
      );


    video.srcObject =
      cameraStream;


    await video.play();


    showStatus(
      'Scanning PDF417... Keep the barcode centered and in focus.',
      'scanning'
    );


    scanTimer =
      setInterval(
        scanCameraFrame,
        500
      );

  }

  catch (error) {

    console.error(error);

    showStatus(
      'Camera error: ' +
      (error.message || error),
      'error'
    );

  }

}



function stopScanner() {

  if (scanTimer) {

    clearInterval(scanTimer);

    scanTimer = null;

  }


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });


    cameraStream = null;

  }


  const video =
    document.getElementById(
      'video'
    );


  if (video) {

    video.srcObject = null;

  }


  decoderBusy = false;

}



async function scanCameraFrame() {

  if (decoderBusy) {
    return;
  }


  const video =
    document.getElementById(
      'video'
    );


  if (
    !video ||
    video.readyState < 2 ||
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return;

  }


  decoderBusy = true;

  scanAttempts++;


  try {

    const canvas =
      document.getElementById(
        'scanCanvas'
      );


    const ctx =
      canvas.getContext(
        '2d',
        {
          willReadFrequently: true
        }
      );


    const originalWidth =
      video.videoWidth;

    const originalHeight =
      video.videoHeight;


    /*
      PDF417 is wide.
      We crop the center portion of the camera image
      so the decoder focuses on the barcode area.
    */

    const cropX =
      Math.round(
        originalWidth * 0.05
      );

    const cropY =
      Math.round(
        originalHeight * 0.25
      );

    const cropWidth =
      Math.round(
        originalWidth * 0.90
      );

    const cropHeight =
      Math.round(
        originalHeight * 0.50
      );


    const maximumWidth =
      1800;


    const scale =
      Math.min(
        1,
        maximumWidth /
        cropWidth
      );


    canvas.width =
      Math.round(
        cropWidth * scale
      );


    canvas.height =
      Math.round(
        cropHeight * scale
      );


    ctx.drawImage(

      video,

      cropX,
      cropY,
      cropWidth,
      cropHeight,

      0,
      0,
      canvas.width,
      canvas.height

    );


    const imageData =
      ctx.getImageData(

        0,
        0,

        canvas.width,
        canvas.height

      );


    const results =
      await ZXingWASM.readBarcodes(

        imageData,

        {

          formats: [
            'PDF417'
          ],

          tryHarder: true,

          tryRotate: true,

          tryInvert: true,

          tryDownscale: true,

          tryDenoise: true,

          maxNumberOfSymbols: 1

        }

      );


    const result =
      results.find(
        function(item) {

          return (
            item &&
            item.isValid &&
            item.text
          );

        }
      );


    if (result) {

      const raw =
        result.text;


      stopScanner();


      showStatus(
        '✓ License barcode detected. Reading information...',
        'success'
      );


      parseLicense(raw);

      return;

    }


    showStatus(

      'Scanning PDF417... ' +
      originalWidth +
      ' × ' +
      originalHeight +
      ' | Attempt ' +
      scanAttempts,

      'scanning'

    );

  }

  catch (error) {

    console.error(
      'Scanner error:',
      error
    );


    showStatus(

      'Scanner active, but the barcode has not been decoded yet.',

      'error'

    );

  }

  finally {

    decoderBusy = false;

  }

}



function getAamvaField(
  raw,
  code
) {

  let text =
    String(raw || '')
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n')
    .replace(
      /[\x1d\x1e\x1f]/g,
      '\n'
    );


  let expression =
    new RegExp(
      '(?:^|\\n)' +
      code +
      '([^\\n]*)',
      'm'
    );


  let match =
    text.match(
      expression
    );


  if (match) {

    return match[1].trim();

  }


  expression =
    new RegExp(
      code +
      '([\\s\\S]*?)' +
      '(?=D[A-Z0-9]{2}|Z[A-Z0-9]{2}|$)'
    );


  match =
    text.match(
      expression
    );


  return match
    ? match[1].trim()
    : '';

}



function formatDate(
  value
) {

  if (!value) {
    return '';
  }


  const numbers =
    String(value)
      .replace(
        /\D/g,
        ''
      );


  if (
    numbers.length !== 8
  ) {

    return '';

  }


  let yyyy;
  let mm;
  let dd;


  const firstFour =
    Number(
      numbers.substring(
        0,
        4
      )
    );


  /*
    Some jurisdictions/versions may return YYYYMMDD.
    Others use MMDDYYYY.
  */

  if (
    firstFour >= 1900 &&
    firstFour <= 2200
  ) {

    yyyy =
      numbers.substring(
        0,
        4
      );

    mm =
      numbers.substring(
        4,
        6
      );

    dd =
      numbers.substring(
        6,
        8
      );

  }

  else {

    mm =
      numbers.substring(
        0,
        2
      );

    dd =
      numbers.substring(
        2,
        4
      );

    yyyy =
      numbers.substring(
        4,
        8
      );

  }


  return (
    yyyy +
    '-' +
    mm +
    '-' +
    dd
  );

}



function cleanName(
  value
) {

  return String(
    value || ''
  )
  .replace(
    /[^A-Za-zÀ-ÿ' -]/g,
    ''
  )
  .trim();

}



function parseLicense(
  raw
) {


  const firstName =
    getAamvaField(
      raw,
      'DAC'
    ) ||

    getAamvaField(
      raw,
      'DCT'
    );


  const lastName =
    getAamvaField(
      raw,
      'DCS'
    );


  const license =
    getAamvaField(
      raw,
      'DAQ'
    );


  const state =
    getAamvaField(
      raw,
      'DAJ'
    );


  const expiration =
    getAamvaField(
      raw,
      'DBA'
    );


  document
    .getElementById(
      'firstName'
    )
    .value =
    cleanName(
      firstName
    );


  document
    .getElementById(
      'lastName'
    )
    .value =
    cleanName(
      lastName
    );


  document
    .getElementById(
      'licenseState'
    )
    .value =
    state;


  document
    .getElementById(
      'licenseLast4'
    )
    .value =
    license
    ? license.slice(-4)
    : '';


  document
    .getElementById(
      'expiration'
    )
    .value =
    formatDate(
      expiration
    );


  if (
    firstName ||
    lastName ||
    license
  ) {

    showStatus(

      '✓ License scanned successfully. Verify the information.',

      'success'

    );

  }

  else {

    showStatus(

      'Barcode detected, but driver fields could not be identified.',

      'error'

    );

  }

}



document
  .getElementById(
    'checkinForm'
  )
  .addEventListener(

    'submit',

    function() {


      const key =
        document
        .getElementById(
          'stationKey'
        )
        .value;


      localStorage.setItem(

        'harbarStationKey',

        key

      );


      showStatus(
        'Saving check-in...',
        'scanning'
      );


      setTimeout(

        function() {

          showStatus(

            '✓ Check-in sent to Google Sheets.',

            'success'

          );

        },

        1500

      );

    }

  );


</script>

</body>

</html>
