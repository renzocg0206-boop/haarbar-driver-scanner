<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Harbar Driver Check-In</title>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/iife/reader/index.js"></script>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 650px;
  margin: auto;
  padding: 20px;
  background: #f5f7fa;
  color: #1f2937;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  color: #1f4e78;
}

video {
  width: 100%;
  max-height: 350px;
  background: black;
  border-radius: 10px;
  margin-top: 10px;
}

.scan-frame {
  position: relative;
}

.scan-guide {
  position: absolute;
  left: 8%;
  right: 8%;
  top: 35%;
  height: 30%;
  border: 3px solid rgba(255,255,255,.90);
  border-radius: 8px;
  pointer-events: none;
  box-sizing: border-box;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 14px;
}

input,
select {
  width: 100%;
  padding: 11px;
  margin-top: 5px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 15px;
}

.scan {
  background: #1f4e78;
  color: white;
}

.save {
  background: #15803d;
  color: white;
}

.stop {
  background: #6b7280;
  color: white;
}

#status {
  margin-top: 15px;
  padding: 12px;
  background: #eee;
  border-radius: 6px;
}

.success {
  background: #dcfce7 !important;
  color: #166534;
}

.error {
  background: #fee2e2 !important;
  color: #991b1b;
}

.scanning {
  background: #dbeafe !important;
  color: #1e3a8a;
}

.small {
  font-size: 12px;
  color: #6b7280;
  margin-top: 5px;
}

#successScreen {
  text-align: center;
  padding: 45px 15px;
}

.success-icon {
  font-size: 65px;
}

.success-title {
  color: #15803d;
  margin-bottom: 10px;
}

.success-message {
  font-size: 18px;
}

.success-instruction {
  color: #6b7280;
  font-size: 16px;
}

</style>

</head>

<body>

<div class="container">

<h1>
HARBAR DRIVER CHECK-IN
</h1>


<button
  type="button"
  class="scan"
  id="scanButton"
  onclick="startScanner()"
>
📷 SCAN DRIVER LICENSE
</button>


<div class="scan-frame">

  <video
    id="video"
    playsinline
    autoplay
    muted>
  </video>

  <div class="scan-guide"></div>

</div>


<canvas
  id="scanCanvas"
  style="display:none;">
</canvas>


<div class="small">
Place the PDF417 barcode on the back of the license inside the rectangle.
</div>


<button
  type="button"
  class="stop"
  id="stopButton"
  onclick="stopScanner()"
>
STOP CAMERA
</button>



<!-- =====================================================
     CHECK-IN FORM
===================================================== -->

<form
  id="checkinForm"
  method="POST"
  target="submitFrame"
>


<!-- STATION KEY OCULTO -->

<input
  type="hidden"
  id="stationKey"
  name="stationKey"
  value="HARBAR-2026"
>


<!-- ID ÚNICO PARA EVITAR DUPLICADOS -->

<input
  type="hidden"
  id="submissionId"
  name="submissionId"
>



<!-- DRIVER NAME -->

<div class="row">

  <div>

    <label>
    First Name
    </label>

    <input
      id="firstName"
      name="firstName"
      required
    >

  </div>


  <div>

    <label>
    Last Name
    </label>

    <input
      id="lastName"
      name="lastName"
      required
    >

  </div>

</div>



<!-- LICENSE -->

<div class="row">

  <div>

    <label>
    License State
    </label>

    <input
      id="licenseState"
      name="licenseState"
      maxlength="2"
    >

  </div>


  <div>

    <label>
    License Last 4
    </label>

    <input
      id="licenseLast4"
      name="licenseLast4"
      maxlength="4"
    >

  </div>

</div>



<label>
License Expiration
</label>

<input
  type="date"
  id="expiration"
  name="expiration"
>



<!-- CARRIER -->

<label>
Carrier / Company
</label>

<input
  id="carrier"
  name="carrier"
  required
>



<!-- PHONE -->

<label>
Phone Number
</label>

<input
  type="tel"
  id="phoneNumber"
  name="phoneNumber"
  placeholder="(000) 000-0000"
  inputmode="tel"
  required
>



<!-- APPOINTMENT -->

<div class="row">

  <div>

    <label>
    Appointment Date
    </label>

    <input
      type="date"
      id="appointmentDate"
      name="appointmentDate"
      required
    >

  </div>


  <div>

    <label>
    Appointment Time
    </label>

    <input
      type="time"
      id="appointmentTime"
      name="appointmentTime"
      required
    >

  </div>

</div>



<!-- REFERENCE -->

<div class="row">

  <div>

    <label>
    Reference Number
    </label>

    <input
      id="referenceNumber"
      name="referenceNumber"
      inputmode="numeric"
      required
    >

  </div>


  <div>

    <label>
    Suffix
    </label>

    <select
      id="referenceSuffix"
      name="referenceSuffix"
      required
    >

      <option value="">
      Select
      </option>

      <option value="T">
      T
      </option>

      <option value="P">
      P
      </option>

    </select>

  </div>

</div>



<!-- TRUCK -->

<div class="row">

  <div>

    <label>
    Truck Number
    </label>

    <input
      id="truckNumber"
      name="truckNumber"
    >

  </div>


  <div>

    <label>
    Trailer Number
    </label>

    <input
      id="trailerNumber"
      name="trailerNumber"
    >

  </div>

</div>



<!-- NOTES -->

<label>
Notes
</label>

<input
  id="notes"
  name="notes"
>



<!-- SAVE BUTTON -->

<button
  class="save"
  type="submit"
  id="saveButton"
>
SAVE CHECK-IN
</button>


</form>



<!-- =====================================================
     SUCCESS SCREEN
===================================================== -->

<div
  id="successScreen"
  style="display:none;"
>

  <div class="success-icon">
  ✅
  </div>

  <h2 class="success-title">
  CHECK-IN COMPLETED
  </h2>

  <p class="success-message">
  Your information has been submitted successfully.
  </p>

  <p class="success-instruction">
  Please wait for warehouse instructions.
  </p>

</div>



<div id="status">
Ready.
</div>



<iframe
  name="submitFrame"
  id="submitFrame"
  style="display:none;">
</iframe>


</div>



<script>


/*****************************************************
 IMPORTANT:
 REPLACE WITH YOUR APPS SCRIPT /exec URL
*****************************************************/

const WEB_APP_URL =
'https://script.google.com/macros/s/AKfycbwAY2uZp9y0eAzxW57NlwQw-tL0F6Y_5CsdmRqkT1KL4HWvO_kL-G6TaFOn4MMvNZJU/exec';



/*****************************************************
 VARIABLES
*****************************************************/

let cameraStream = null;

let scanTimer = null;

let decoderBusy = false;

let scanAttempts = 0;

let submitting = false;



/*****************************************************
 CONNECT FORM TO APPS SCRIPT
*****************************************************/

document
  .getElementById(
    'checkinForm'
  )
  .action =
  WEB_APP_URL;



/*****************************************************
 CREATE UNIQUE SUBMISSION ID
*****************************************************/

function generateSubmissionId() {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (

    Date.now() +

    '-' +

    Math.random()
      .toString(36)
      .substring(2)

  );

}


document
  .getElementById(
    'submissionId'
  )
  .value =
  generateSubmissionId();



/*****************************************************
 STATUS
*****************************************************/

function showStatus(
  message,
  type = ''
) {

  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    message;


  status.className =
    type;

}



/*****************************************************
 START CAMERA
*****************************************************/

async function startScanner() {

  try {

    stopScanner();

    scanAttempts = 0;


    showStatus(
      'Opening camera...',
      'scanning'
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Camera is not supported by this browser.'
      );

    }


    const constraints = {

      audio: false,

      video: {

        facingMode: {
          ideal: 'environment'
        },

        width: {
          ideal: 1920
        },

        height: {
          ideal: 1080
        }

      }

    };


    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia(
          constraints
        );


    const video =
      document.getElementById(
        'video'
      );


    video.srcObject =
      cameraStream;


    await video.play();


    showStatus(

      'Scanning PDF417... Keep the barcode centered and in focus.',

      'scanning'

    );


    scanTimer =
      setInterval(

        scanCameraFrame,

        500

      );

  }

  catch (error) {

    console.error(error);


    showStatus(

      'Camera error: ' +
      (
        error.message ||
        error
      ),

      'error'

    );

  }

}



/*****************************************************
 STOP CAMERA
*****************************************************/

function stopScanner() {

  if (scanTimer) {

    clearInterval(
      scanTimer
    );

    scanTimer =
      null;

  }


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    cameraStream =
      null;

  }


  const video =
    document.getElementById(
      'video'
    );


  if (video) {

    video.srcObject =
      null;

  }


  decoderBusy =
    false;

}



/*****************************************************
 SCAN CAMERA FRAME
*****************************************************/

async function scanCameraFrame() {

  if (decoderBusy) {

    return;

  }


  const video =
    document.getElementById(
      'video'
    );


  if (
    !video ||
    video.readyState < 2 ||
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return;

  }


  decoderBusy =
    true;


  scanAttempts++;


  try {


    const canvas =
      document.getElementById(
        'scanCanvas'
      );


    const ctx =
      canvas.getContext(

        '2d',

        {
          willReadFrequently: true
        }

      );


    const originalWidth =
      video.videoWidth;


    const originalHeight =
      video.videoHeight;


    const cropX =
      Math.round(
        originalWidth * 0.05
      );


    const cropY =
      Math.round(
        originalHeight * 0.25
      );


    const cropWidth =
      Math.round(
        originalWidth * 0.90
      );


    const cropHeight =
      Math.round(
        originalHeight * 0.50
      );


    const maximumWidth =
      1800;


    const scale =
      Math.min(

        1,

        maximumWidth /
        cropWidth

      );


    canvas.width =
      Math.round(

        cropWidth *
        scale

      );


    canvas.height =
      Math.round(

        cropHeight *
        scale

      );


    ctx.drawImage(

      video,

      cropX,
      cropY,

      cropWidth,
      cropHeight,

      0,
      0,

      canvas.width,
      canvas.height

    );


    const imageData =
      ctx.getImageData(

        0,
        0,

        canvas.width,
        canvas.height

      );


    const results =
      await ZXingWASM
        .readBarcodes(

          imageData,

          {

            formats: [
              'PDF417'
            ],

            tryHarder: true,

            tryRotate: true,

            tryInvert: true,

            tryDownscale: true,

            tryDenoise: true,

            maxNumberOfSymbols: 1

          }

        );


    const result =
      results.find(

        function(item) {

          return (

            item &&

            item.isValid &&

            item.text

          );

        }

      );


    if (result) {


      const raw =
        result.text;


      stopScanner();


      showStatus(

        '✓ License barcode detected. Reading information...',

        'success'

      );


      parseLicense(
        raw
      );


      return;

    }


    showStatus(

      'Scanning PDF417... ' +

      originalWidth +

      ' × ' +

      originalHeight +

      ' | Attempt ' +

      scanAttempts,

      'scanning'

    );


  }

  catch (error) {


    console.error(

      'Scanner error:',

      error

    );


    showStatus(

      'Scanner active, but the barcode has not been decoded yet.',

      'error'

    );

  }

  finally {


    decoderBusy =
      false;

  }

}



/*****************************************************
 NORMALIZE AAMVA DATA
*****************************************************/

function normalizeAamvaText(
  raw
) {

  return String(
    raw || ''
  )

  .replace(
    /<LF>/gi,
    '\n'
  )

  .replace(
    /<CR>/gi,
    '\n'
  )

  .replace(
    /<GS>/gi,
    '\n'
  )

  .replace(
    /<RS>/gi,
    '\n'
  )

  .replace(
    /<US>/gi,
    '\n'
  )

  .replace(
    /\\n/g,
    '\n'
  )

  .replace(
    /\\r/g,
    '\n'
  )

  .replace(
    /\r\n/g,
    '\n'
  )

  .replace(
    /\r/g,
    '\n'
  )

  .replace(
    /[\x1c\x1d\x1e\x1f]/g,
    '\n'
  )

  .replace(
    /\u0000/g,
    ''
  );

}



/*****************************************************
 GET AAMVA FIELD
*****************************************************/

function getAamvaField(
  raw,
  code
) {


  const text =
    normalizeAamvaText(
      raw
    );


  const lines =
    text.split(
      '\n'
    );


  for (
    let i = 0;
    i < lines.length;
    i++
  ) {


    let line =
      lines[i].trim();


    if (!line) {

      continue;

    }


    const position =
      line.indexOf(
        code
      );


    if (
      position !== -1
    ) {


      let value =
        line.substring(

          position +
          code.length

        );


      const nextField =
        value.search(
          /D[A-Z0-9]{2}|Z[A-Z0-9]{2}/
        );


      if (
        nextField > 0
      ) {

        value =
          value.substring(
            0,
            nextField
          );

      }


      return cleanField(
        value
      );

    }

  }


  const expression =
    new RegExp(

      code +

      '([\\s\\S]*?)' +

      '(?=D[A-Z0-9]{2}|Z[A-Z0-9]{2}|$)'

    );


  const match =
    text.match(
      expression
    );


  if (match) {

    return cleanField(
      match[1]
    );

  }


  return '';

}



/*****************************************************
 CLEAN FIELD
*****************************************************/

function cleanField(
  value
) {

  return String(
    value || ''
  )

  .replace(
    /<LF>/gi,
    ''
  )

  .replace(
    /<CR>/gi,
    ''
  )

  .replace(
    /<GS>/gi,
    ''
  )

  .replace(
    /<RS>/gi,
    ''
  )

  .replace(
    /<US>/gi,
    ''
  )

  .replace(
    /<[^>]+>/g,
    ''
  )

  .replace(
    /[\r\n\t]/g,
    ''
  )

  .trim();

}



/*****************************************************
 CLEAN NAME
*****************************************************/

function cleanName(
  value
) {

  return cleanField(
    value
  )

  .replace(
    /[^A-Za-zÀ-ÿ' -]/g,
    ''
  )

  .replace(
    /\s+/g,
    ' '
  )

  .trim();

}



/*****************************************************
 CLEAN STATE
*****************************************************/

function cleanState(
  value
) {

  return cleanField(
    value
  )

  .replace(
    /[^A-Za-z]/g,
    ''
  )

  .substring(
    0,
    2
  )

  .toUpperCase();

}



/*****************************************************
 CLEAN LICENSE
*****************************************************/

function cleanLicenseNumber(
  value
) {

  return cleanField(
    value
  )

  .replace(
    /[^A-Za-z0-9]/g,
    ''
  )

  .trim();

}



/*****************************************************
 FORMAT DATE
*****************************************************/

function formatDate(
  value
) {


  if (!value) {

    return '';

  }


  const numbers =
    cleanField(
      value
    )
    .replace(
      /\D/g,
      ''
    );


  if (
    numbers.length !== 8
  ) {

    return '';

  }


  let yyyy;

  let mm;

  let dd;


  const firstFour =
    Number(

      numbers.substring(
        0,
        4
      )

    );


  if (
    firstFour >= 1900 &&
    firstFour <= 2200
  ) {


    yyyy =
      numbers.substring(
        0,
        4
      );


    mm =
      numbers.substring(
        4,
        6
      );


    dd =
      numbers.substring(
        6,
        8
      );

  }

  else {


    mm =
      numbers.substring(
        0,
        2
      );


    dd =
      numbers.substring(
        2,
        4
      );


    yyyy =
      numbers.substring(
        4,
        8
      );

  }


  const monthNumber =
    Number(
      mm
    );


  const dayNumber =
    Number(
      dd
    );


  if (
    monthNumber < 1 ||
    monthNumber > 12 ||
    dayNumber < 1 ||
    dayNumber > 31
  ) {

    return '';

  }


  return (

    yyyy +

    '-' +

    mm +

    '-' +

    dd

  );

}



/*****************************************************
 PARSE DRIVER LICENSE
*****************************************************/

function parseLicense(
  raw
) {


  const firstNameRaw =

    getAamvaField(
      raw,
      'DAC'
    )

    ||

    getAamvaField(
      raw,
      'DCT'
    );


  const lastNameRaw =

    getAamvaField(
      raw,
      'DCS'
    );


  const licenseRaw =

    getAamvaField(
      raw,
      'DAQ'
    );


  const stateRaw =

    getAamvaField(
      raw,
      'DAJ'
    );


  const expirationRaw =

    getAamvaField(
      raw,
      'DBA'
    );


  const firstName =
    cleanName(
      firstNameRaw
    );


  const lastName =
    cleanName(
      lastNameRaw
    );


  const licenseNumber =
    cleanLicenseNumber(
      licenseRaw
    );


  const state =
    cleanState(
      stateRaw
    );


  const expiration =
    formatDate(
      expirationRaw
    );


  document
    .getElementById(
      'firstName'
    )
    .value =
    firstName;


  document
    .getElementById(
      'lastName'
    )
    .value =
    lastName;


  document
    .getElementById(
      'licenseState'
    )
    .value =
    state;


  document
    .getElementById(
      'licenseLast4'
    )
    .value =

    licenseNumber

    ?

    licenseNumber.slice(
      -4
    )

    :

    '';


  document
    .getElementById(
      'expiration'
    )
    .value =
    expiration;


  if (
    firstName ||
    lastName ||
    licenseNumber
  ) {


    showStatus(

      '✓ License scanned successfully. Verify the information.',

      'success'

    );

  }

  else {


    showStatus(

      'Barcode detected, but driver information could not be identified.',

      'error'

    );

  }

}



/*****************************************************
 PREVENT MULTIPLE SUBMISSIONS
*****************************************************/

const checkinForm =
  document.getElementById(
    'checkinForm'
  );


const saveButton =
  document.getElementById(
    'saveButton'
  );


const submitFrame =
  document.getElementById(
    'submitFrame'
  );



checkinForm.addEventListener(

  'submit',

  function(event) {


    if (submitting) {

      event.preventDefault();

      return false;

    }


    submitting =
      true;


    saveButton.disabled =
      true;


    saveButton.textContent =
      'SENDING CHECK-IN...';


    saveButton.style.opacity =
      '0.6';


    saveButton.style.cursor =
      'not-allowed';


    stopScanner();


    showStatus(

      'Sending check-in... Please wait.',

      'scanning'

    );

  }

);



/*****************************************************
 AFTER FORM SUBMISSION
*****************************************************/

submitFrame.addEventListener(

  'load',

  function() {


    if (!submitting) {

      return;

    }


    checkinForm.style.display =
      'none';


    document
      .getElementById(
        'scanButton'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'stopButton'
      )
      .style.display =
      'none';


    document
      .querySelector(
        '.scan-frame'
      )
      .style.display =
      'none';


    document
      .querySelector(
        '.small'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'status'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'successScreen'
      )
      .style.display =
      'block';

  }

);


</script>

</body>

</html>
